[package]
name = "zymic_core"
version = "0.1.3"
edition = "2021"
description = """
Core library providing the primitives and streaming APIs for the Zymic
authenticated encryption format.
"""
license = "MIT"
keywords = ["encryption","cli"]
categories = ["cryptography"]
repository = "https://github.com/dpottavio/zymic"
readme = "README.md"

[dependencies]
aes-gcm = {version = "0.11", features = ["alloc", "aes"], default-features = false}
hkdf = { version = "0.13", default-features = false}
serde = { version = "1.0", features = ["derive"], default-features = false, optional = true }
sha2 = {version = "0.11", default-features = false}
subtle = { version = "2.6", default-features = false }
zeroize = {version = "1.9", default-features = false, optional = true}

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std", "zeroize"]

serde = ["dep:serde"]
std = []
v1 = []
zeroize = ["dep:zeroize", "aes-gcm/zeroize"]

[dev-dependencies]
criterion = { version = "0.4"}
getrandom = "0.4"

[[bench]]
name = "stream_bench"
harness = false
